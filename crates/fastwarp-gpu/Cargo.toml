[package]
name = "fastwarp-gpu"
version.workspace = true
publish = false
edition = "2021"
description = "wgpu compute device layer and go/no-go probe for the GPU registration engine"
license = "Apache-2.0"

[lib]
name = "fastwarp_gpu"
path = "src/lib.rs"

[features]
dev-tools = ["dep:clap", "dep:rayon", "dep:serde_json"]

[[bin]]
name = "fastwarp_gpu_probe"
path = "src/bin/fastwarp_gpu_probe.rs"
required-features = ["dev-tools"]

[[bin]]
name = "fastwarp_reg_syn"
path = "src/bin/fastwarp_reg_syn.rs"
required-features = ["dev-tools"]

[[bin]]
name = "fastwarp_reg_ab"
path = "src/bin/fastwarp_reg_ab.rs"
required-features = ["dev-tools"]

[[test]]
name = "gpu_kernels"
path = "tests/gpu_kernels.rs"
required-features = ["dev-tools"]

[[test]]
name = "ab_real_subject"
path = "tests/ab_real_subject.rs"
required-features = ["dev-tools"]

[dependencies]
wgpu = "30"
bytemuck = { version = "1.14", features = ["derive"] }
thiserror = "2"
pollster = "1"
fastwarp-reg = { path = "../fastwarp-reg" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
clap = { version = "4.5", features = ["derive", "std"], optional = true }
rayon = { version = "1.10", optional = true }

[target.'cfg(any(windows, target_os = "linux", target_os = "android", target_os = "freebsd"))'.dependencies]
ash = { version = "0.38", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-metal = { version = "0.3.2", default-features = false, features = ["MTLDevice"] }

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
