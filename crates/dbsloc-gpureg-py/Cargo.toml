[package]
name = "dbsloc-gpureg-py"
version.workspace = true
edition = "2021"
description = "Python bindings (PyO3) for the dbs-localizer GPU registration engine"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
dbsloc-reg = { path = "../dbsloc-reg" }
dbsloc-gpu = { path = "../dbsloc-gpu" }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py310"] }
numpy = "0.30"
