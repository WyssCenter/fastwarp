[package]
name = "dbsloc-gpureg-py"
version.workspace = true
license.workspace = true
edition = "2021"
description = "Python bindings (PyO3) for the dbs-localizer GPU registration engine"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
dbsloc-reg = { path = "../dbsloc-reg" }
dbsloc-gpu = { path = "../dbsloc-gpu" }
dbsloc-niftiio = { path = "../dbsloc-niftiio" }
ndarray = "0.17"
pyo3 = { version = "0.30", features = ["abi3-py310"] }
numpy = "0.30"
rayon = "1.10"
