[package]
name = "fastwarp-py"
version.workspace = true
license.workspace = true
edition = "2021"
description = "Python bindings (PyO3) for the FastWarp GPU registration engine"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
fastwarp-cli = { path = "../fastwarp-cli" }
fastwarp-reg = { path = "../fastwarp-reg" }
pyo3 = { version = "0.30", features = ["abi3-py311"] }
numpy = "0.30"
serde_json = "1"
