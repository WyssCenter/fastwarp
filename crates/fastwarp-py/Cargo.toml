[package]
name = "fastwarp-py"
version.workspace = true
license.workspace = true
edition = "2021"
description = "Python bindings (PyO3) for the FastWarp GPU registration engine"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
fastwarp-reg = { path = "../fastwarp-reg" }
fastwarp-gpu = { path = "../fastwarp-gpu" }
fastwarp-niftiio = { path = "../fastwarp-niftiio" }
ndarray = "0.17"
pyo3 = { version = "0.30", features = ["abi3-py311"] }
numpy = "0.30"
rayon = "1.10"
