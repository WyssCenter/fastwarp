[package]
name = "dbsloc-reg"
version.workspace = true
license.workspace = true
edition = "2021"
description = "Wyss DBS Localizer registration engine: grids, volumes, ITK-compatible transform I/O and point mapping (CPU)"

[lib]
name = "dbsloc_reg"
path = "src/lib.rs"

[dependencies]
dbsloc-core = { path = "../dbsloc-core", features = ["nifti"] }
dbsloc-niftiio = { path = "../dbsloc-niftiio" }
dbsloc-matfile = { path = "../dbsloc-matfile" }
nifti = "0.17"
ndarray = "0.16"
thiserror = "1.0"
miniz_oxide = "0.8"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
rayon = "1.10"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
