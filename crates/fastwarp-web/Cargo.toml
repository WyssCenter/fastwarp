[package]
name = "fastwarp-web"
version.workspace = true
license.workspace = true
publish = false
edition = "2021"
description = "FastWarp in a web browser: the registration on WebGPU, called from JavaScript"

[lib]
name = "fastwarp_web"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
fastwarp-core = { path = "../fastwarp-core" }
fastwarp-reg = { path = "../fastwarp-reg" }
fastwarp-gpu = { path = "../fastwarp-gpu" }
crc32fast = "1"
serde_json = "1"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
