[package]
name = "dbsloc-matfile"
version.workspace = true
edition = "2021"
description = "Wyss DBS Localizer reader for MATLAB v7.3 (HDF5) .mat files: char, numeric, logical, cell and struct values with lazy reference dereferencing"

[lib]
name = "dbsloc_matfile"
path = "src/lib.rs"

[dependencies]
thiserror = "1.0"
miniz_oxide = "0.8"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
rayon = "1.10"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
