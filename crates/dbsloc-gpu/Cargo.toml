[package]
name = "dbsloc-gpu"
version.workspace = true
edition = "2021"
description = "wgpu compute device layer and go/no-go probe for the GPU registration engine"

[lib]
name = "dbsloc_gpu"
path = "src/lib.rs"

[features]
dev-tools = ["dep:clap", "dep:rayon", "dep:serde_json"]

[[bin]]
name = "dbsloc_gpu_probe"
path = "src/bin/dbsloc_gpu_probe.rs"
required-features = ["dev-tools"]

[[bin]]
name = "dbsloc_reg_syn"
path = "src/bin/dbsloc_reg_syn.rs"
required-features = ["dev-tools"]

[[bin]]
name = "dbsloc_reg_ab"
path = "src/bin/dbsloc_reg_ab.rs"
required-features = ["dev-tools"]

[[test]]
name = "gpu_kernels"
path = "tests/gpu_kernels.rs"
required-features = ["dev-tools"]

[[test]]
name = "ab_real_subject"
path = "tests/ab_real_subject.rs"
required-features = ["dev-tools"]

[dependencies]
wgpu = "29"
bytemuck = { version = "1.14", features = ["derive"] }
thiserror = "1.0"
pollster = "0.4"
dbsloc-reg = { path = "../dbsloc-reg" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
clap = { version = "4.5", features = ["derive", "std"], optional = true }
rayon = { version = "1.10", optional = true }

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
