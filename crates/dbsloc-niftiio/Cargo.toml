[package]
name = "dbsloc-niftiio"
version.workspace = true
edition = "2021"
description = "Fast NIfTI-1 reading (single pass, parallel decode) and writing (parallel single-member gzip) for Wyss DBS Localizer"

[lib]
name = "dbsloc_niftiio"
path = "src/lib.rs"

[dependencies]
bytemuck = "1"
crc32fast = "1.4"
flate2 = { version = "1", features = ["zlib-rs"] }
ndarray = "0.16"
nifti = "0.17"
rayon = "1.10"
thiserror = "1.0"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
