# GPU (wgpu) SyN registration from Wyss DBS Localizer, packaged as a Python extension.
# crates/dbsloc-{core,niftiio,matfile,reg,gpu} are copies of WyssCenter/fastwarp 90c1df3 (2026-11-10)
[workspace]
resolver = "2"
members = [
    "crates/dbsloc-core",
    "crates/dbsloc-niftiio",
    "crates/dbsloc-matfile",
    "crates/dbsloc-reg",
    "crates/dbsloc-gpu",
    "crates/dbsloc-gpureg-py",
]

[workspace.package]
version = "0.4.0"
license = "Apache-2.0"

[profile.release]
# Same as a plain dbs-localizer release build; the wheel is built with --release.
debug = false
