# Wheels for macOS, Linux and Windows (one abi3 wheel per platform covers Python >= 3.11), the
# standalone fastwarp program and its installer scripts. A tag v* also attests the files, drafts a
# GitHub release with them attached, publishes the wheels and the sdist to PyPI, and then publishes
# the release.
name: wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      testpypi:
        description: Upload the built wheels and the sdist to TestPyPI
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, manylinux: "2_28" }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: "2_28" }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { name: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin }
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc }
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: "1.16.0"
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --locked --release --out dist
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: matrix.target != 'x86_64-apple-darwin'
        with:
          version: "0.13.7"
      - name: Smoke test on the oldest supported Python (import; GPU tests run where an adapter exists)
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        env:
          UV_PYTHON: "3.11"
          UV_PYTHON_PREFERENCE: only-managed
        run: |
          uv sync --locked --no-install-project
          uv pip install --no-deps dist/*.whl
          uv run --no-sync python -c "import fastwarp as g; print(g.__version__, g.ENGINE_SOURCE); print('gpu:', g.gpu_info() if g.gpu_available() else 'none')"
          uv run --no-sync python -VV
          uv run --no-sync pytest tests -v -rs
          uv pip install --no-config --require-hashes --no-deps -r ci/numpy-floor.txt
          uv run --no-sync python -c "import numpy; print('numpy', numpy.__version__)"
          uv run --no-sync pytest tests -q -rs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: "1.16.0"
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz

  cli:
    name: cli-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Linux builds in the manylinux 2.28 image of the wheels, so the program needs glibc 2.28 only.
    container: ${{ matrix.container }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_x86_64:2026.10.31-1@sha256:43f7ce12d79ed98b6dbfa3291d5afe389efd40a7e76de089959ffe99501b6edf
            rustup-sha256: b1c8cb14e30889e7e2999e6b69e62d9e9b9ffc0f4df8180564d306d9680e6c55
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_aarch64:2026.10.31-1@sha256:724b504247662e1cf122590957c857211ec2d16b113ec134f92c570a2d01250f
            rustup-sha256: 9f608c142e0e38a78957d0661ba1dfaf0b6fb37184cfaa4b9a0aa57af6184282
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { name: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin }
          # Static CRT: the program runs on a Windows without the Visual C++ runtime installed.
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc, rustflags: "-C target-feature=+crt-static" }
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      RUSTUP_VERSION: "1.29.3"
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install rustup in the container
        if: matrix.container
        env:
          RUSTUP_SHA256: ${{ matrix.rustup-sha256 }}
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 -o /tmp/rustup-init \
            "https://static.rust-lang.org/rustup/archive/$RUSTUP_VERSION/$TARGET/rustup-init"
          echo "$RUSTUP_SHA256  /tmp/rustup-init" | sha256sum -c -
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --no-modify-path --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Rust toolchain
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked -p fastwarp-cli --target "$TARGET"
      - name: Check the linked libraries
        run: |
          exe="target/$TARGET/release/fastwarp"
          case "$TARGET" in
            *-linux-gnu)
              readelf -d "$exe" | grep NEEDED
              bad=$(readelf -d "$exe" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' \
                | grep -Ev '^(libc\.so\.6|libm\.so\.6|libdl\.so\.2|libpthread\.so\.0|librt\.so\.1|libgcc_s\.so\.1|ld-linux-(x86-64|aarch64)\.so\.[12])$' || true)
              [ -z "$bad" ] || { echo "unexpected shared libraries: $bad"; exit 1; }
              max=$(objdump -T "$exe" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -n 1)
              echo "highest glibc symbol version: $max"
              [ "$(printf '%s\n' "$max" 2.28 | sort -V | tail -n 1)" = 2.28 ] || { echo "needs glibc $max"; exit 1; }
              ;;
            *-apple-darwin)
              lipo -archs "$exe"
              otool -L "$exe"
              bad=$(otool -L "$exe" | tail -n +2 | awk '{print $1}' | grep -Ev '^(/usr/lib/|/System/Library/)' || true)
              [ -z "$bad" ] || { echo "unexpected libraries: $bad"; exit 1; }
              otool -l "$exe" | grep -A4 LC_BUILD_VERSION | grep minos
              otool -l "$exe" | grep -A4 LC_BUILD_VERSION | grep -q 'minos 11.0' || { echo "minimum macOS is not 11.0"; exit 1; }
              ;;
            *-windows-msvc)
              if grep -aqiE 'vcruntime140|msvcp140|api-ms-win-crt' "$exe.exe"; then
                echo "fastwarp.exe imports the Visual C++ runtime DLLs"
                exit 1
              fi
              ;;
          esac
      - name: Smoke test (gpu-info exits 4 on a runner without a usable GPU)
        run: |
          exe="target/$TARGET/release/fastwarp"
          rosetta=
          if [ "$TARGET" = x86_64-apple-darwin ] && [ "$(uname -m)" = arm64 ]; then
            if arch -x86_64 /usr/bin/true 2>/dev/null; then
              rosetta=1
            else
              echo "::warning::Rosetta 2 is not installed on the runner; the x86_64 program was built but not run"
              exit 0
            fi
          fi
          fw() {
            if [ -n "$rosetta" ]; then arch -x86_64 "$exe" "$@"; else "$exe" "$@"; fi
          }
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "$(fw --version)" = "fastwarp $v" ] || { echo "unexpected version: $(fw --version)"; exit 1; }
          fw recipe > recipe.json
          fw recipe --channels 2 > /dev/null
          set +e
          fw gpu-info
          status=$?
          set -e
          echo "gpu-info exit status $status"
          case $status in 0 | 4) ;; *) exit 1 ;; esac
      - name: Package
        env:
          COPYFILE_DISABLE: "1"
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          name="fastwarp-$TARGET"
          ext=
          case "$TARGET" in *-windows-msvc) ext=.exe ;; esac
          mkdir -p "pkg/$name" dist
          cp "target/$TARGET/release/fastwarp$ext" LICENSE NOTICE "pkg/$name/"
          printf 'fastwarp %s, the FastWarp command line, for %s.\nDocumentation: https://github.com/WyssCenter/fastwarp/blob/v%s/docs/cli.md\nLicence: Apache-2.0; see LICENSE and NOTICE.\n' \
            "$v" "$TARGET" "$v" > "pkg/$name/README.txt"
          if [ -n "$ext" ]; then
            archive="$name.zip"
            pwsh -NoProfile -Command "Add-Type -AssemblyName System.IO.Compression.FileSystem; [IO.Compression.ZipFile]::CreateFromDirectory('pkg/$name', 'dist/$archive', 'Optimal', \$true)"
          else
            archive="$name.tar.gz"
            tar -C pkg -czf "dist/$archive" "$name"
          fi
          cd dist
          if command -v sha256sum > /dev/null; then sum=$(sha256sum "$archive"); else sum=$(shasum -a 256 "$archive"); fi
          printf '%s  %s\n' "${sum%% *}" "$archive" > "$archive.sha256"
          cat "$archive.sha256"
      - name: Install the archive with install.sh
        if: contains(matrix.target, 'linux') || matrix.target == 'aarch64-apple-darwin'
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          FASTWARP_DOWNLOAD_URL="file://$PWD/dist" sh scripts/install.sh --version "$v" --dir "$RUNNER_TEMP/fastwarp-bin" --no-modify-path
          [ "$("$RUNNER_TEMP/fastwarp-bin/fastwarp" --version)" = "fastwarp $v" ]
          sh scripts/install.sh --uninstall --dir "$RUNNER_TEMP/fastwarp-bin"
          [ ! -e "$RUNNER_TEMP/fastwarp-bin" ]
      - name: End-to-end test of install.sh on macOS
        if: matrix.target == 'aarch64-apple-darwin'
        run: sh ci/test-install.sh
      - name: Install the archive with install.ps1
        if: contains(matrix.target, 'windows')
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $bin = Join-Path $env:RUNNER_TEMP 'fastwarp-bin'
          $env:FASTWARP_DOWNLOAD_URL = ([Uri](Resolve-Path dist).ProviderPath).AbsoluteUri
          ./scripts/install.ps1 -Version $v -Dir $bin -NoModifyPath
          $out = & (Join-Path $bin 'fastwarp.exe') --version
          if ($LASTEXITCODE -ne 0 -or $out -ne "fastwarp $v") { throw "unexpected: $out" }
          ./scripts/install.ps1 -Uninstall -Dir $bin
          if (Test-Path -LiteralPath $bin) { throw "$bin was not removed" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  installers:
    needs: cli
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          path: cli
          merge-multiple: true
      - name: Write the version and the archive checksums into the installer scripts
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          (cd cli && sha256sum -c ./*.sha256)
          set --
          for t in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc; do
            f="cli/fastwarp-$t.tar.gz.sha256"
            [ -f "$f" ] || f="cli/fastwarp-$t.zip.sha256"
            h=$(cut -d' ' -f1 "$f")
            printf '%s\n' "$h" | grep -Eqx '[0-9a-f]{64}'
            set -- "$@" -e "s/@FASTWARP_SHA256_$t@/$h/g"
          done
          mkdir dist
          sed -e "s/@FASTWARP_VERSION@/$v/g" "$@" scripts/install.sh > dist/fastwarp-installer.sh
          sed -e "s/@FASTWARP_VERSION@/$v/g" "$@" scripts/install.ps1 > dist/fastwarp-installer.ps1
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME != Cargo.toml $v"
            exit 1
          fi
          if grep -n '@FASTWARP_' dist/*; then exit 1; fi
          grep -nF "$v" dist/*
      - name: Install the Linux x86_64 archive with the stamped fastwarp-installer.sh
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          FASTWARP_DOWNLOAD_URL="file://$PWD/cli" sh dist/fastwarp-installer.sh --dir "$RUNNER_TEMP/b" --no-modify-path \
            > install.log
          cat install.log
          grep -q 'checksum held in this installer' install.log
          [ "$("$RUNNER_TEMP/b/fastwarp" --version)" = "fastwarp $v" ]
          sh dist/fastwarp-installer.sh --uninstall --dir "$RUNNER_TEMP/b"
          [ ! -e "$RUNNER_TEMP/b" ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers
          path: dist/*
          if-no-files-found: error

  attest:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, sdist, cli, installers]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Build provenance for the release files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.zip
            dist/fastwarp-installer.sh
            dist/fastwarp-installer.ps1

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, sdist, cli, installers, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Check the tag matches the package version
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != Cargo.toml $v"; exit 1; }
      - name: Draft the GitHub release with all files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## /{p = ($2 == v)} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $v"; exit 1; }
          printf '\nInstall the standalone fastwarp program, check a download and verify its provenance: %s\n' \
            "https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/cli.md#install" >> notes.md
          (cd dist && find . -maxdepth 1 -type f ! -name '*.sha256' -printf '%P\n' | LC_ALL=C sort | xargs sha256sum) > SHA256SUMS
          mv SHA256SUMS dist/
          gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md --draft --verify-tag

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, sdist, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/fastwarp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{wheel-*,sdist}"
          path: dist
          merge-multiple: true
      - name: PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the drafted GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --repo "${GITHUB_REPOSITORY}"

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.testpypi && github.ref == 'refs/heads/main'
    needs: [build, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/fastwarp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{wheel-*,sdist}"
          path: dist
          merge-multiple: true
      - name: TestPyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
