# Every push / PR: lint, Rust tests and the Python tests on Linux (Mesa lavapipe software Vulkan).
# macOS and Windows build in wheels.yml (tags, manual runs): macOS minutes count 10x on private repos.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_OPT_LEVEL: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p dbsloc-gpureg-py --all-targets -- -D warnings
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pipx run ruff check python tests && pipx run ruff format --check python tests

  test:
    runs-on: ubuntu-latest
    env:
      # Mesa's lavapipe is the only adapter on the runner; the engine refuses software
      # adapters unless this is set.
      WGPU_FORCE_FALLBACK_ADAPTER: "1"
      DBSLOC_GPU_ALLOW_SOFTWARE: "1"
      DBSLOC_GPU_REQUIRE_ADAPTER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Mesa Vulkan software driver (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-nextest
      - name: Rust tests (engine crates)
        run: >-
          cargo nextest run --workspace --exclude dbsloc-gpureg-py
          --features dbsloc-gpu/dev-tools --profile ci
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build and install the wheel
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release -o dist
          python -m pip install dist/*.whl pytest antspyx
      - name: Python tests
        run: |
          python -c "import dbsloc_gpureg as g; print(g.gpu_info())"
          python -m pytest tests -v
