# Starts the browser demo in headless Chrome on Chrome's software GPU (SwiftShader): the device
# start compiles every kernel with Chrome's own shader compiler and runs the self-test, then the
# sample is registered on the 2 mm grid. Fails on any WebGPU error. The fault-injection cases of the
# same script run in full.yml.
name: web

on:
  push:
    branches: [main]
    paths:
      - "crates/fastwarp-gpu/src/**"
      - "crates/fastwarp-web/**"
      - "docs/_static/web/**"
      - "docs/_scripts/build_web_demo.sh"
      - "docs/browser.md"
      - "ci/web-faults.mjs"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "crates/fastwarp-gpu/src/**"
      - "crates/fastwarp-web/**"
      - "docs/_static/web/**"
      - "docs/_scripts/build_web_demo.sh"
      - "docs/browser.md"
      - "ci/web-faults.mjs"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  start:
    name: Browser demo starts and registers in headless Chrome
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: web-demo
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: WebAssembly module and sample images
        run: bash docs/_scripts/build_web_demo.sh
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Documentation with the demo page
        run: |
          python -m pip install --require-hashes --only-binary :all: -r docs/requirements.txt
          python -m sphinx -W --keep-going -b html docs "$RUNNER_TEMP/html"
      - name: Start and registration in headless Chrome
        run: node ci/web-faults.mjs "$RUNNER_TEMP/html" --chrome "$(command -v google-chrome)" --swiftshader --suite start
