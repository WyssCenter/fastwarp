[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "dbsloc-gpureg"
dynamic = ["version"]  # from Cargo.toml [workspace.package]
description = "GPU (wgpu: Vulkan / Metal / DX12) image registration from Wyss DBS Localizer (Rigid, Affine, SyN), with ANTs-compatible outputs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["numpy"]
authors = [{ name = "Richard Köhler" }, { name = "Wyss Center for Bio and Neuroengineering" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Private :: Do Not Upload",
]

[tool.maturin]
manifest-path = "crates/dbsloc-gpureg-py/Cargo.toml"
python-source = "python"
module-name = "dbsloc_gpureg._core"
features = ["pyo3/extension-module"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W605"]

[tool.pytest.ini_options]
testpaths = ["tests"]
