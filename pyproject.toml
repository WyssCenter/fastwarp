[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "fastwarp"
dynamic = ["version"]  # from Cargo.toml [workspace.package]
description = "FastWarp: GPU (wgpu: Vulkan / Metal / DX12) image registration (Rigid, Affine, SyN), with ANTs-compatible outputs"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["numpy>=2.0"]
authors = [
    { name = "Richard M. Köhler" },
    { name = "Jan Philipp Payonk" },
]
keywords = ["image registration", "GPU", "wgpu", "ANTs", "SyN", "neuroimaging", "MRI"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.scripts]
fastwarp = "fastwarp.__main__:main"

[project.urls]
Repository = "https://github.com/WyssCenter/fastwarp"
Documentation = "https://fastwarp.readthedocs.io"
Issues = "https://github.com/WyssCenter/fastwarp/issues"
Changelog = "https://github.com/WyssCenter/fastwarp/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "maturin>=1.9.4,<2",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
ants = ["antspyx>=0.6.1"]
benchmark = [
    { include-group = "ants" },
    "matplotlib>=3.9",
    "scipy>=1.15",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinx>=9.0.4",
    "sphinx-autoapi>=3.9.0",
]

[tool.uv]
exclude-newer = "7 days"
constraint-dependencies = ["scipy>=1.15"]

[tool.maturin]
manifest-path = "crates/fastwarp-py/Cargo.toml"
python-source = "python"
module-name = "fastwarp._core"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W605"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
